<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JengoPlus</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-dark mb-3"><div class="container">
<a class="navbar-brand" href="{% url 'home' %}">JengoPlus</a>
{% if user.is_authenticated %}<div class="text-white small">{{ user.username }} ({{ user.role }})
{% if user.role == 'admin' %}<a class="text-white ms-2" href="{% url 'claims' %}">Claims</a><a class="text-white ms-2" href="/admin/">Manage</a>{% endif %}
<form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}<button class="btn btn-sm btn-outline-light ms-2">Logout</button></form></div>{% endif %}
</div></nav><div class="container pb-5">
{% for m in messages %}<div class="alert alert-info">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}</div></body></html>
