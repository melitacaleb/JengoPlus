<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in | JengoPlus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><script src="js/layout.js"></script></head>
<body data-page="login"><div id="site-header"></div><main class="section"><div class="container"><div class="row justify-content-center"><div class="col-md-6 col-lg-4">
<div class="hazard"></div><h2 class="mb-3">Sign in</h2><form class="jp-card" data-demo="login">
<label class="form-label">I am a</label><div class="btn-group w-100 mb-3" role="group">
<input type="radio" class="btn-check" name="role" id="r1" value="supervisor.html" checked><label class="btn btn-outline-secondary" for="r1">Supervisor</label>
<input type="radio" class="btn-check" name="role" id="r2" value="admin.html"><label class="btn btn-outline-secondary" for="r2">Administrator</label></div>
<label class="form-label" for="u">Username</label><input id="u" class="form-control mb-3" autocomplete="username" required>
<label class="form-label" for="pw">Password</label><div class="input-group mb-3"><input id="pw" type="password" class="form-control" autocomplete="current-password" required><button type="button" id="showPw" class="btn btn-outline-secondary" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
<button class="btn btn-jp w-100">Sign in</button><p class="small text-mute mt-3 mb-0">Forgot your password? Ask an administrator to send a reset link.</p></form></div></div></div></main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script></body></html>
