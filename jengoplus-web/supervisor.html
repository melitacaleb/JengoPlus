<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supervisor | JengoPlus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><script src="js/layout.js"></script></head>
<body data-page="sup"><div id="site-header"></div><main class="container py-4">
<div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3"><div><div class="hazard"></div><h2>Good morning, Wanjiku</h2><p class="text-mute mb-0">Riverside Apartments &middot; Block B foundation</p></div>
<select class="form-select w-auto" aria-label="Choose site"><option>Riverside Apartments</option><option>Nakuru Depot</option></select></div>
<ul class="nav nav-pills mb-3 gap-1" role="tablist"><li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#att"><i class="bi bi-people me-1"></i>Attendance</button></li>
<li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#exp"><i class="bi bi-receipt me-1"></i>Expense</button></li>
<li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#progress"><i class="bi bi-camera me-1"></i>Progress</button></li></ul>
<div class="tab-content"><div class="tab-pane fade show active" id="att">
<div class="jp-card mb-3"><div class="d-flex justify-content-between"><b>Present today: <span id="count">0</span> of 10 planned</b><button id="submitAtt" class="btn btn-jp btn-sm">Submit session</button></div>
<div class="progress mt-2"><div id="bar" class="progress-bar" style="width:0"></div></div><div id="over" class="small text-danger mt-2 d-none"><i class="bi bi-exclamation-triangle"></i> Headcount is above the plan. The administrator will be asked to review.</div></div>
<p class="text-mute small">Tap a worker to take their photo. Tap again to undo.</p>
<div class="row g-2" id="workerGrid" data-planned="10">
<div class="col-6 col-md-4 col-lg-3"><button class="tile" data-name="Peter Otieno"><i class="bi bi-check-circle-fill chk"></i><b>Peter Otieno</b><small>W-001 &middot; Mason</small><input type="file" accept="image/*" capture="environment" hidden></button></div>
<div class="col-6 col-md-4 col-lg-3"><button class="tile" data-name="John Kamau"><i class="bi bi-check-circle-fill chk"></i><b>John Kamau</b><small>W-002 &middot; Steel fixer</small><input type="file" accept="image/*" capture="environment" hidden></button></div>
<div class="col-6 col-md-4 col-lg-3"><button class="tile" data-name="Mary Achieng"><i class="bi bi-check-circle-fill chk"></i><b>Mary Achieng</b><small>W-003 &middot; Labourer</small><input type="file" accept="image/*" capture="environment" hidden></button></div>
<div class="col-6 col-md-4 col-lg-3"><button class="tile" data-name="David Mwangi"><i class="bi bi-check-circle-fill chk"></i><b>David Mwangi</b><small>W-004 &middot; Carpenter</small><input type="file" accept="image/*" capture="environment" hidden></button></div>
<div class="col-6 col-md-4 col-lg-3"><button class="tile" data-name="Grace Njeri"><i class="bi bi-check-circle-fill chk"></i><b>Grace Njeri</b><small>W-005 &middot; Labourer</small><input type="file" accept="image/*" capture="environment" hidden></button></div>
<div class="col-6 col-md-4 col-lg-3"><button class="tile" data-name="Samuel Kiptoo"><i class="bi bi-check-circle-fill chk"></i><b>Samuel Kiptoo</b><small>W-006 &middot; Operator</small><input type="file" accept="image/*" capture="environment" hidden></button></div></div></div>
<div class="tab-pane fade" id="exp"><form class="jp-card" data-demo="expense" data-msg="Expense sent for review"><h4 class="mb-3">Submit an expense</h4><div class="row g-3">
<div class="col-md-6"><label class="form-label">Task</label><select class="form-select"><option>Block B foundation</option></select></div>
<div class="col-md-6"><label class="form-label">Category</label><select class="form-select"><option>Materials</option><option>Labour</option><option>Transport</option><option>Equipment</option></select></div>
<div class="col-md-4"><label class="form-label">Amount (KES)</label><input type="number" min="1" class="form-control" required></div>
<div class="col-md-4"><label class="form-label">Date</label><input type="date" class="form-control" required></div>
<div class="col-md-4"><label class="form-label">Paid to</label><input class="form-control" required></div>
<div class="col-12"><label class="form-label">Receipt photo</label><input type="file" accept="image/*,.pdf" capture="environment" class="form-control" required></div>
<div class="col-12"><button class="btn btn-jp">Send for review</button></div></div></form></div>
<div class="tab-pane fade" id="progress"><form class="jp-card" data-demo="progress" data-msg="Progress report sent"><h4 class="mb-3">Report progress</h4><div class="row g-3">
<div class="col-md-6"><label class="form-label">Task</label><select class="form-select"><option>Block B foundation</option></select></div>
<div class="col-md-6"><label class="form-label">Work done today</label><input class="form-control" placeholder="e.g. 40 m of trench dug"></div>
<div class="col-12"><label class="form-label">What happened</label><textarea class="form-control" rows="3" required></textarea></div>
<div class="col-12"><label class="form-label">Site photo</label><input type="file" accept="image/*" capture="environment" class="form-control" required></div>
<div class="col-12"><button class="btn btn-jp">Send report</button></div></div></form></div></div></main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script></body></html>
